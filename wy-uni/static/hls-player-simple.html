<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播播放器</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: fill;
        }
    </style>
</head>
<body>
    <video id="video" controls autoplay muted></video>

    <script>
        const video = document.getElementById('video');

        // 从 URL 参数获取播放地址，默认播放 testroom123
        const params = new URLSearchParams(window.location.search);
        const streamUrl = params.get('url') || 'http://localhost:8081/live/testroom123.m3u8';

        console.log('播放地址:', streamUrl);

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                console.log('解析完成，开始播放');
                video.play().catch(e => console.log('自动播放失败:', e));
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                console.error('播放错误:', data);
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log('网络错误，尝试重连...');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log('媒体错误，尝试恢复...');
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                console.log('解析完成，开始播放');
                video.play();
            });
        }
    </script>
</body>
</html>
