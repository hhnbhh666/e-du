<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播播放器</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            position: relative;
        }
        video {
            width: 100%;
            display: block;
            background: #000;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .url {
            font-size: 12px;
            color: #ccc;
            word-break: break-all;
        }
        .status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        .status.playing {
            background: rgba(76, 175, 80, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="video" controls autoplay muted></video>
        <div class="info">
            <div class="title">SRS 直播播放器</div>
            <div class="url" id="url"></div>
        </div>
        <div class="status" id="status">加载中...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const urlEl = document.getElementById('url');

        // 从 URL 参数获取播放地址，默认播放 testroom123
        const params = new URLSearchParams(window.location.search);
        const streamUrl = params.get('url') || 'http://localhost:8081/live/testroom123.m3u8';

        urlEl.textContent = streamUrl;
        console.log('播放地址:', streamUrl);

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                console.log('解析完成，开始播放');
                statusEl.textContent = '正在播放';
                statusEl.classList.add('playing');
                video.play().catch(e => console.log('自动播放失败:', e));
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                console.error('播放错误:', data);
                statusEl.textContent = '播放错误: ' + data.details;
                statusEl.style.background = 'rgba(244, 67, 54, 0.8)';
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log('网络错误，尝试重连...');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log('媒体错误，尝试恢复...');
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                console.log('解析完成，开始播放');
                statusEl.textContent = '正在播放';
                statusEl.classList.add('playing');
                video.play();
            });
        } else {
            statusEl.textContent = '浏览器不支持 HLS 播放';
            statusEl.style.background = 'rgba(244, 67, 54, 0.8)';
        }
    </script>
</body>
</html>
