# ngrok 配置文件
# 使用方法：
# 1. 访问 https://dashboard.ngrok.com/signup 注册账号
# 2. 登录后复制 Authtoken
# 3. 运行：ngrok config add-authtoken 你的 token
# 4. 运行：ngrok start --config ngrok.yml --all

version: "2"

authtoken: YOUR_AUTHTOKEN_HERE

tunnels:
  backend-api:
    proto: http
    addr: 8080
    labels:
      - "name=Backend API"
  
  srs-live:
    proto: http
    addr: 8081
    labels:
      - "name=SRS Live Stream"
